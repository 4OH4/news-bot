# Feed views (ADR-0012, ADR-0013): publish writes each as views/<name>.json; the API
# pages them (GET /api/feed?view=<name>). Unknown keys are rejected. Names: lowercase
# letters, digits, '-'. tags: sources with any of them (omit for all); a tagged view
# reads its sources' newest max_items articles, the untagged view reuses feed.json's
# 72-hour read. order: newest | score. max_items: 1 to 1000.
views:
  news:
    tags: [news]
    order: newest
    max_items: 300
  feed:
    order: score
    max_items: 500
  longer:
    tags: [long-form]
    order: score
    max_items: 200
