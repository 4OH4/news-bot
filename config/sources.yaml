# News sources for the ingest stage, loaded by newsfeed.config.load_sources.
#
# The curated list from issue #16. Every feed below was fetched through the
# project's polite HttpFetcher (robots.txt respected) when it was added, and its
# article pages were reachable with our User-Agent (except LWN's subscriber-only
# articles, which return 403). Grouped by kind. Tags: "metered" = the publisher
# meters a paywall but served full text to us; "paywall" = some articles show
# only a preview; "js-heavy" = client-hydrated pages that stress extractors.
#
# Schema (validated by models.Source; unknown keys are rejected):
#
#   sources:
#     - id: bbc-news          # required, unique; lowercase letters, digits, '-' and '_'
#       type: rss             # required: rss | google_news | hn | reddit
#       url: https://...      # feed or listing URL; required for type rss
#       query: "..."          # search query, for google_news
#       weight: 1.0           # ranking multiplier, >= 0; 0 disables in ranking (default 1.0)
#       enabled: true         # false skips the source entirely (default true)
#       tags: [news, uk]      # free-form labels (default [])
#       options: {}           # type-specific settings, read by the ingester (default {})
#
# Type-specific settings (unknown option keys are rejected when ingesting):
#
#   google_news: exactly one of
#       query: "..."          # a Google News search, or
#       url: https://news.google.com/rss/...   # a full Google News RSS URL, used as is
#     options (query only):
#       hl: en-GB             # language (default en-GB)
#       gl: GB                # edition country (default GB)
#       ceid: GB:en           # edition id (default <gl>:<language part of hl>)
#     Item links are news.google.com redirect URLs, not publisher URLs (see #50).
#
#   hn: the Hacker News front page, via the Algolia HN Search API
#       url: https://hn.algolia.com/api/v1/search?...   # optional; overrides the front-page query
#     options:
#       min_points: 0         # skip stories with fewer points (default 0)
#       max_items: 30         # keep at most this many, highest points first (default 30)
#
#   reddit: no ingester yet.

sources:
  # --- UK and world news ---
  - id: bbc-news
    type: rss
    url: https://feeds.bbci.co.uk/news/rss.xml
    tags: [news, uk]

  - id: guardian-world
    type: rss
    url: https://www.theguardian.com/world/rss
    tags: [news, world]

  - id: independent-uk
    type: rss
    url: https://www.independent.co.uk/news/uk/rss
    tags: [news, uk]

  - id: inews
    type: rss
    url: https://inews.co.uk/feed
    tags: [news, uk]

  - id: dw-news
    type: rss
    url: https://rss.dw.com/rdf/rss-en-all
    tags: [news, world, live-blogs]

  - id: business-insider
    type: rss
    url: https://feeds.businessinsider.com/custom/all
    tags: [news, business, paywall]

  # --- Technology ---
  - id: ars-technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    tags: [tech]

  - id: the-verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    tags: [tech, js-heavy, metered]

  - id: wired
    type: rss
    url: https://www.wired.com/feed/rss
    tags: [tech, metered]

  - id: lwn
    type: rss
    url: https://lwn.net/headlines/rss
    tags: [tech, linux, paywall]

  - id: 404media
    type: rss
    url: https://www.404media.co/rss/
    tags: [tech, paywall]

  - id: mit-tech-review
    type: rss
    url: https://www.technologyreview.com/feed/
    tags: [tech, science, metered]

  # --- Science and climate ---
  - id: nature-news
    type: rss
    url: https://www.nature.com/nature.rss
    tags: [science]

  - id: quanta
    type: rss
    url: https://www.quantamagazine.org/feed/
    tags: [science, long-form]

  - id: phys-org
    type: rss
    url: https://phys.org/rss-feed/
    tags: [science]

  - id: carbon-brief
    type: rss
    url: https://www.carbonbrief.org/feed/
    tags: [science, climate]

  - id: bbc-future
    type: rss
    url: https://www.bbc.com/future/feed.rss
    tags: [science, js-heavy]

  # --- Long-form and magazines ---
  - id: guardian-longread
    type: rss
    url: https://www.theguardian.com/news/series/the-long-read/rss
    tags: [long-form]

  - id: aeon
    type: rss
    url: https://aeon.co/feed.rss
    tags: [long-form, essay]

  - id: new-yorker
    type: rss
    url: https://www.newyorker.com/feed/everything
    tags: [long-form, magazine, metered]

  # --- Blogs and newsletters ---
  - id: simon-willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    tags: [blog, tech]

  - id: julia-evans
    type: rss
    url: https://jvns.ca/atom.xml
    tags: [blog, tech]

  - id: martin-fowler
    type: rss
    url: https://martinfowler.com/feed.atom
    tags: [blog, tech]

  - id: cloudflare-blog
    type: rss
    url: https://blog.cloudflare.com/rss/
    tags: [blog, tech]

  - id: noahpinion
    type: rss
    url: https://www.noahpinion.blog/feed
    tags: [blog, economics, paywall]

  # EXAMPLES of the discovery sources (#11). The Google News query is a
  # placeholder until #50 decides on queries; the Hacker News example stays
  # disabled until the human decides whether to enable it.
  - id: example-google-news
    type: google_news
    query: "example placeholder topic"
    enabled: false
    weight: 0.5
    tags: [example, discovery]
    options:
      hl: en-GB
      gl: GB

  - id: example-hacker-news
    type: hn
    enabled: false
    tags: [example, tech, discovery]
    options:
      min_points: 100
      max_items: 20
