# Interest rules, loaded by newsfeed.rank.interests.load_interests and used by
# the rank stage to order the feed. A missing or empty file means no rules:
# articles then score on recency and source weight alone.
#
# First version of the reader's rules (#80), proposed from the sources in
# sources.yaml and the titles of the Phase 1 live run; tune from here.
# Unknown keys are rejected.
#
# Quote keywords that YAML would read as a boolean or number (on, off, yes,
# no, 2024), e.g. "on" or "2024"; unquoted they are not strings and are rejected.
#
# Schema (everything is optional):
#
#   topics:                       # a match adds weight x field weight
#                                 # for each field it is found in
#     - name: example-topic       # unique label, shown in the score breakdown
#       keywords: [foo, "bar baz"]  # case-insensitive words or phrases,
#                                 # matched on word boundaries ("ai" does not
#                                 # match "maintain")
#       weight: 2.0               # may be negative to demote a topic: the
#                                 # score is then multiplied by
#                                 # 1 / (1 + |weight| x strongest field
#                                 # weight), e.g. -1 in the body halves it;
#                                 # never 0, so demoted articles keep order
#
#   mute_keywords: [foo]          # one in the title or summary mutes the
#                                 # article: scored and stored, but left out
#                                 # of the feed; one only in the body halves
#                                 # the score instead
#
#   sources:                      # keyed by source id from sources.yaml
#     some-source-id:
#       weight: 1.5               # multiplier, replaces Source.weight
#     other-source-id:
#       mute: true                # leave this source out of the feed
#                                 # (give weight or mute, not both)
#
#   recency:
#     half_life_hours: 24         # an article's recency score halves every
#                                 # this many hours (default 24)
#
#   fields:                       # how much a keyword match counts by where
#     title: 3.0                  # it was found (defaults shown)
#     summary: 2.0
#     body: 1.0
#
#   scoring:
#     body_only_demotion: 1.0     # share of a demotion applied when a negative
#                                 # topic matches only in the body (default 1,
#                                 # unchanged); 0 ignores such matches, 0.5
#                                 # halves the demotion strength. The
#                                 # breakdown then has demote_body_only:<name>

# --- How the weights were chosen --------------------------------------------
# An unmatched article scores 1 (before source and recency). A topic of
# weight 1 found in the title adds 3, in the summary 2, in the body 1, so a
# title-and-summary match at weight 2 lifts an article to 11: it stays above a
# brand-new unmatched story for about three and a half half-lives (~3.5 days).
#
# Demotion multiplies instead, by 1 / (1 + |weight| x strongest field). At -2
# a title match gives 0.14, a summary match 0.2 and a body-only match 0.33.
# A sport story (sport in its title) then sinks below unmatched stories even
# when its body mentions a liked topic (3 x 0.14 = 0.43); it only rises above
# them when a liked topic is in its title and summary too (11 x 0.14 = 1.6).
# At -1 the same sport story would score 0.75 and a story with a liked topic
# in its title alone 1.75, so most demotions would barely show. Stronger than
# -2 mostly hurts the stories that only mention a demoted keyword in passing
# in the body (a third of their score at -2, a quarter at -3), which are
# common: news sites' related-links and sport roundups end up in the body.

topics:
  # Interests, strongest first.
  - name: ai
    weight: 2.0
    keywords:
