      - Prime Day

# Muted: left out of the feed when in the title or summary. These are the
# non-articles seen in the Phase 1 run: affiliate coupon pages, daily cartoons
# and newsletter or app sign-up items.
mute_keywords:
  - promo codes
  - promo code
  - coupon codes
  - coupon code
  - coupons
  - daily cartoon
  - sign up now
  - download now

# Per-source multipliers, replacing the weight in sources.yaml (1.0 by
# default). The personal blogs post rarely and are close to the interests
# above, so they get a lift; the high-volume general sources are damped so
# they don't fill the feed on volume alone.
sources:
  simon-willison:
    weight: 1.5
  julia-evans:
    weight: 1.5
  martin-fowler:
    weight: 1.3
  lwn:
    weight: 1.3
  quanta:
    weight: 1.3
  carbon-brief:
    weight: 1.2
  dw-news:
    weight: 0.7
  business-insider:
    weight: 0.6
  independent-uk:
    weight: 0.8

recency:
  half_life_hours: 24

fields:
  title: 3.0
  summary: 2.0
  body: 1.0
