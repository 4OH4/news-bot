# Per-domain extraction overrides, loaded by
# newsfeed.extract.overrides.load_extraction_config and applied by the
# extractor chain (newsfeed.extract.chain.ExtractorChain).
#
# Domains not listed here use the default chain: trafilatura, then the
# readability and newspaper4k fallbacks, stopping at the first "ok" result.
#
# Schema (unknown keys are rejected):
#
#   domains:
#     example.com:                 # host with or without "www."; also matches
#                                  # subdomains (news.example.com). The longest
#                                  # matching key wins; levels are not merged.
#       order: [readability, trafilatura]   # extractors to try, in order
#                                  # (trafilatura | readability | newspaper4k)
#       render: playwright         # also try the JavaScript renderer (#15),
#                                  # after the static extractors. Needs the
#                                  # optional `playwright` group and Chromium
#                                  # (see README.md)
#       min_words: 80              # words needed for "ok" (default 150)
#     paywalled.example.org:
#       mode: summary_only         # don't extract; keep the feed summary
#                                  # (status "skipped"). Can't be combined
#                                  # with order, render or min_words.
#
# Add domains here when `make eval` (#18) shows the default chain doing badly
# on them.

domains:
  # Phase 1 review (#21, docs/phase1-review.md): trafilatura stops after the
  # first section of some Ars Technica articles (251 of ~820 words on
  # ars-2026-10-16-openai-models-hacked-a-crypto-wallet) and appends the
  # affiliate disclaimer and author bio on others. Readability is clean on all
  # four Ars evaluation entries, so it goes first.
  arstechnica.com:
    order: [readability, trafilatura, newspaper4k]
