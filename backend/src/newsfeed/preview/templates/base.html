<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Preview{% endblock %}</title>
<style>
:root { color-scheme: light dark; --bg: #fdfdfc; --fg: #1c1c1c; --muted: #666; --link: #0b57d0; --line: #ddd; --ok: #1b7f3b; --warn: #a15c00; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #e8e8e8; --muted: #999; --link: #8ab4f8; --line: #333; --ok: #6fcf8a; --warn: #f0b45a; --bad: #f2877f; } }
body { margin: 0; padding: 1rem 16px 4rem; background: var(--bg); color: var(--fg); font: 1.0625rem/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 70ch; margin: 0 auto; }
a { color: var(--link); }
nav { max-width: 70ch; margin: 0 auto 1.5rem; display: flex; gap: 1rem; font-size: .9rem; }
h1 { line-height: 1.25; }
.meta { color: var(--muted); font-size: .875rem; }
.badge { font-size: .75rem; padding: 0 .45em; border: 1px solid currentColor; border-radius: 4px; text-transform: uppercase; }
.badge-ok { color: var(--ok); } .badge-partial, .badge-paywalled, .badge-skipped { color: var(--warn); } .badge-failed { color: var(--bad); }
ul.list { list-style: none; padding: 0; }
ul.list li { padding: .8rem 0; border-bottom: 1px solid var(--line); }
ul.list .t { font-weight: 600; }
.error { color: var(--bad); overflow-wrap: anywhere; }
article img, article video, .lead { max-width: 100%; height: auto; }
article pre { overflow-x: auto; }
article table { display: block; overflow-x: auto; }
article, h1, .meta { overflow-wrap: anywhere; }
</style>
</head>
<body>
<nav><a href="{{ root|default('') }}index.html">Articles</a><a href="{{ root|default('') }}failures.html">Failures</a></nav>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
