[project]
name = "newsfeed"
version = "0.1.0"
description = "Self-hosted personalised news feed pipeline: ingest, extract, rank, publish."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "nh3>=0.3.7",
    "protego>=0.7.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1,<2.4",
    "typer>=0.27.3",
]

[project.scripts]
newsfeed = "newsfeed.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
    "types-lxml>=2026.2.16",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["newsfeed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests/fakes.py"]
mypy_path = "src"

# feedparser ships no type hints (no py.typed, no typeshed stubs); its results
# are treated as Any and checked at runtime in ingest/rss.py.
[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: touches the real network; excluded by default (run with -m live)",
]
addopts = '-m "not live" --disable-socket --allow-unix-socket'
