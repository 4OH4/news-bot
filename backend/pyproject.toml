[project]
name = "newsfeed"
version = "0.1.0"
description = "Self-hosted personalised news feed pipeline: ingest, extract, rank, publish."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[project.scripts]
newsfeed = "newsfeed.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["newsfeed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests/fakes.py"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: touches the real network; excluded by default (run with -m live)",
]
addopts = '-m "not live" --disable-socket --allow-unix-socket'
