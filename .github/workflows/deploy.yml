# Deploy: once CI has passed on a push to main, build the backend image, push it
# to Artifact Registry and point the Cloud Run Job at it (#75). The next scheduled
# run uses the new image. It authenticates through Workload Identity Federation,
# so no key exists, and it never runs Terraform (ADR-0004).
#
# infra/terraform/wif.tf accepts tokens only from this file, on main, started by
# workflow_run. Renaming this file or changing its trigger needs a change there.
#
# Actions are pinned to full commit SHAs because this job can change what runs in
# the cloud.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time. A deploy in progress finishes, and only the newest waiting
# one runs after it, so an older image can't overwrite a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # The branch filter above also matches a fork's pull request from a branch
    # called main, so check that CI ran for a push to this repository's main.
    # Without GCP_WIF_PROVIDER the job skips, so merges stay green until the
    # owner has applied wif.tf and set the repository variables (infra/README.md).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for the token that wif.tf trusts
    env:
      IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}/newsfeed:${{ github.event.workflow_run.head_sha }}
    steps:
      # The commit CI passed, not whatever main has become since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Let Docker push to Artifact Registry
        env:
          REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # provenance is off so each image is one manifest: an attestation would be
      # a second version, counting against the registry's keep-10 cleanup policy.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
          cache-from: type=gha

      # Image only: any other change here would show as drift in the next plan.
      - name: Update the Cloud Run Job
        env:
          JOB: ${{ vars.GCP_JOB_NAME }}
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: gcloud run jobs update "$JOB" --image="$IMAGE" --region="$REGION" --project="$PROJECT" --quiet
