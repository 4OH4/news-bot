# CI: lint, test and Docker build on every PR and on pushes to main.
# The job names `lint`, `test` and `docker` are required status checks on `main` (#4),
# so don't rename them without updating branch protection.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to a PR branch cancels the superseded run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tags, so it is pinned to a release commit.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails the job if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --directory backend

      - name: Lint (ruff + mypy)
        run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --directory backend

      - name: Test
        run: make test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only: nothing is pushed and no registry credentials are needed.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: newsfeed:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
