# Offline Terraform checks for changes under infra/ (#127): formatting and validation.
# No plan or apply, no secrets and no GCP credentials. `init -backend=false` skips the
# state bucket, and the only network use is downloading the provider. Not a required
# status check (a path-filtered required check would block PRs that don't touch infra/).
name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full commit SHA, like setup-uv. 1.6.6 is the oldest release that
      # satisfies required_version (>= 1.6.0), so newer-only syntax is caught here.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      # -lockfile=readonly fails if the committed .terraform.lock.hcl would change,
      # so CI and the owner use the same provider versions.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate
