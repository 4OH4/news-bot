# Opens a PR when a base image pinned in backend/Dockerfile has a newer build (#256).
# Dependabot reads only FROM lines. Other ecosystems are deliberately left out.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
