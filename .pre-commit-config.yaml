# Installed by `make setup`. Run on everything with:
#   uv run --project backend pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Keep Markdown's two-space hard line breaks.
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: detect-private-key

  # ruff runs from the backend uv environment so hooks, `make lint` and CI share
  # the version pinned in backend/uv.lock. Scoped to backend/ to match `make lint`.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
        require_serial: true
